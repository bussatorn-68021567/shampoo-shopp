<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Hair Care</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a class="brand" href="index.html">Hair Care</a>
      <nav class="site-nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container container--narrow">
        <div class="section-head">
          <h1>สั่งซื้อสินค้า</h1>
          <p>กรอกข้อมูลด้านล่าง เราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อ</p>
        </div>

        <form id="orderForm" class="order-form">
          <label class="field">
            <span>ชื่อลูกค้า</span>
            <input type="text" id="customerName" name="customerName" autocomplete="name" required>
          </label>

          <label class="field">
            <span>เบอร์โทร / Line</span>
            <input type="text" id="contact" name="contact" autocomplete="tel" required>
          </label>

          <label class="field">
            <span>รายการสินค้า</span>
            <input type="text" id="items" name="items" required>
          </label>

          <label class="field">
            <span>จำนวนเงินรวม (บาท)</span>
            <input type="number" id="total" name="total" min="0" inputmode="numeric" required>
          </label>

          <label class="field">
            <span>หมายเหตุ</span>
            <textarea id="note" name="note" rows="3"></textarea>
          </label>

          <button type="submit" class="btn btn--solid btn--block">ยืนยันสั่งซื้อ</button>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Hair Care</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
